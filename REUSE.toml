# Machine-readable license map (https://reuse.software). It covers ReQurv's own
# files; everything else in this repository keeps the license stated by its
# upstream (see LICENSING.md). Annotating by path avoids editing any file
# header, so upstream syncs never conflict with it.
version = 1
SPDX-PackageName = "ReAgent"
SPDX-PackageDownloadLocation = "https://github.com/CesaTor/phillis_one"

[[annotations]]
path = [
  "REAGENT.md",
  ".github/workflows/reagent-build.yml",
  "LICENSING.md",
  "apps/desktop/src/distribution/**",
  "apps/desktop/assets/reagent/**",
  "apps/desktop/public/reagent/*.png",
  "apps/desktop/public/reagent/*.webp",
  "apps/desktop/electron/product-home.ts",
  "apps/desktop/electron/product-home.test.ts",
  "apps/desktop/electron/app-icon.distribution.test.ts",
  "apps/desktop/src/plugins/hermes-bots/primary-handle.ts",
  "apps/desktop/src/plugins/hermes-bots/primary-handle.test.ts",
  "apps/desktop/src/plugins/hermes-bots/plugin.mentions.primary-handle.test.ts",
  "apps/desktop/src/plugins/hermes-bots/cron-pane.primary-handle.test.tsx",
  "apps/desktop/src/plugins/hermes-bots/canonical-group-list-boot.test.tsx",
  "plugins/model-providers/requrv-hive/**",
  "apps/desktop/scripts/set-exe-identity.reagent.test.mjs",
  "scripts/licenses/collect.mjs",
  "scripts/licenses/AUDIT.md",
  "scripts/licenses/pypi-cache.json",
  "tests/providers/test_requrv_hive_profile.py",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 ReQurv"
SPDX-License-Identifier = "LicenseRef-ReQurv-Proprietary"

# Third-party files inside ReQurv's directories keep their own license.
[[annotations]]
path = ["apps/desktop/public/reagent/fonts/**"]
precedence = "override"
SPDX-FileCopyrightText = "The Syne Project Authors"
SPDX-License-Identifier = "OFL-1.1"

# Copies of third-party license texts shown in the app's Licenses screen keep the
# license of what they reproduce.
[[annotations]]
path = ["apps/desktop/src/distribution/licenses/nous-research-mit.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2025 Nous Research"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [
  "apps/desktop/src/distribution/licenses/security-guidance-apache-2.0.txt",
  "apps/desktop/src/distribution/licenses/security-guidance-NOTICE.txt",
]
precedence = "override"
SPDX-FileCopyrightText = "Anthropic, PBC"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["apps/desktop/src/distribution/licenses/syne-ofl-1.1.txt"]
precedence = "override"
SPDX-FileCopyrightText = "The Syne Project Authors"
SPDX-License-Identifier = "OFL-1.1"
